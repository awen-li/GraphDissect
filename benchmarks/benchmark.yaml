# benchmarks.yaml
# Empirical study benchmarks grouped by domain.
#
# Minimal schema update:
# - Keep the top-level "benchmarks:" map.
# - Each domain key now maps to:
#     - domain_name: exact display name used in papers/tables
#     - items: list of benchmark entries (same fields as before)
#
# Benchmark entry fields:
#  - name: OSS-Fuzz project name / benchmark identifier
#  - loc_kloc: code size in KLoC (thousand LOC)
#  - executables: representative executables/CLIs analyzed or fuzzed in the study
#  - num_drivers: number of driver configurations (fill in when finalized)

