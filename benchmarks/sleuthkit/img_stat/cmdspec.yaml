profile:
  name: "img_stat"
  binary: "img_stat"
  domain: "metadata"
  seed_dir: "seeds"
  max_combination: 2
  base_args: []
  io:
    input:
      kind: "positional"
      flag: ""
    output:
      kind: "none"
      flag: ""

primary:
  - id: "1"
    cli: ["-t"]
    kind: "flag"
    role: "mode"
    include_in_search: true
    description: "Display image type only."

  - id: "2"
    cli: ["-v"]
    kind: "flag"
    role: "mode"
    include_in_search: true
    description: "Verbose output to stderr."

  - id: "3"
    cli: ["-V"]
    kind: "flag"
    role: "mode"
    include_in_search: true
    description: "Print version and exit."

  - id: "4"
    cli: ["-i"]
    kind: "choice"
    metavar: "IMGTYPE"
    choices:
      - "raw"
      - "aff"
      - "ewf"
      - "list"
    defaults: ["raw", "list"]
    role: "mode"
    include_in_search: true
    description: "Image format type (use 'list' for supported types)."

  - id: "5"
    cli: ["-b"]
    kind: "value"
    metavar: "DEV_SECTOR_SIZE"
    value_template: "512"
    defaults: ["512", "4096"]
    role: "mode"
    include_in_search: true
    description: "Device sector size in bytes."

constraints:
  - type: "exclusive"
    option: "-V"

